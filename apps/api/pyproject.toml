[project]
name = "augura-api"
version = "0.1.0"
description = "Augura API — monolithe modulaire FastAPI"
readme = "README.md"
authors = [
    { name = "Quentin Caron", email = "quentin.caron0@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "pydantic-settings>=2.14.1",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.49.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
# Les handlers FastAPI (@app.get, @app.exception_handler) et les fixtures pytest sont
# enregistrés par décorateur : pyright les voit « non accédés ». Faux positif structurel,
# pervasif dans tout codebase FastAPI — on désactive cette règle, le reste reste strict.
reportUnusedFunction = false

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID252"]

[tool.importlinter]
root_package = "augura_api"

[[tool.importlinter.contracts]]
name = "core est indépendant des modules et des jobs"
type = "forbidden"
source_modules = ["augura_api.core"]
forbidden_modules = ["augura_api.modules", "augura_api.jobs"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.11",
    "modal>=1.5.0",
    "pyright>=1.1.410",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.17",
]
