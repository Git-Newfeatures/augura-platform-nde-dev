[project]
name = "augura-api"
version = "0.1.0"
description = "Augura API — monolithe modulaire FastAPI"
readme = "README.md"
authors = [
    { name = "Quentin Caron", email = "quentin.caron0@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "anthropic>=0.109.1",
    "asyncpg>=0.31.0",
    "cryptography>=49.0.0",
    "fastapi>=0.136.3",
    "openai>=2.41.1",
    "openpyxl>=3.1.5",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.49.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: nécessite un Postgres réel (AUGURA_DATABASE_URL) — tourne en CI",
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
# Les handlers FastAPI (@app.get, @app.exception_handler) et les fixtures pytest sont
# enregistrés par décorateur : pyright les voit « non accédés ». Faux positif structurel,
# pervasif dans tout codebase FastAPI — on désactive cette règle, le reste reste strict.
reportUnusedFunction = false

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID252"]

[tool.ruff.lint.per-file-ignores]
# Les prompts LLM et les schémas JSON embarqués contiennent des chaînes
# littérales qu'on ne peut pas couper sans altérer le texte envoyé au modèle.
"src/augura_api/modules/semantic/enrich_propose.py" = ["E501"]

[tool.importlinter]
root_package = "augura_api"

[[tool.importlinter.contracts]]
name = "core est indépendant des modules et des jobs"
type = "forbidden"
source_modules = ["augura_api.core"]
forbidden_modules = ["augura_api.modules", "augura_api.jobs"]

# Les modules de données restent mutuellement indépendants. `agents` est la
# couche d'orchestration : il peut consommer l'interface publique de `corpus`
# (retrieval E1, spec §8), donc il n'est pas dans cet ensemble d'indépendance.
[[tool.importlinter.contracts]]
name = "les modules de données ne s'importent pas entre eux"
type = "independence"
modules = [
    "augura_api.modules.studies",
    "augura_api.modules.corpus",
    "augura_api.modules.datasets",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.11",
    "modal>=1.5.0",
    "pyright>=1.1.410",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.17",
]
