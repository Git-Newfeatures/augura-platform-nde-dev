name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest -q

  db-bundle:
    # Applies the Supabase bundle on a real Postgres + pgvector and proves
    # that the schema is created, that the seed loads, and that RLS isolation holds.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: augura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: augura
      AUGURA_ENV: dev
      AUGURA_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/augura
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Migrate (schema triggered by the backend — alembic upgrade head)
        run: uv run alembic upgrade head
      - name: Seed (data, outside migrations)
        run: psql -v ON_ERROR_STOP=1 -f supabase/seed.sql
      - name: Integration fixtures (deterministic test data for repos + smoke)
        run: psql -v ON_ERROR_STOP=1 -f tests/integration/fixtures.sql
      - name: Smoke — seed counts
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            if (select count(*) from documents)          <> 8  then raise exception 'documents != 8'; end if;
            if (select count(*) from simulation_results) <> 12 then raise exception 'simulation_results != 12'; end if;
            if (select count(*) from cohort_biomarkers)  <> 12 then raise exception 'cohort_biomarkers != 12'; end if;
          end $$;
          SQL
      - name: Smoke — RLS isolation (non-exempt role)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          set role augura_app;
          set app.tenant_id = '33cb3ba0-00fe-420b-a8c7-70736aaacc44';
          do $$ begin
            if (select count(*) from cohort_members) <> 6 then
              raise exception 'current tenant: expected 6 members, saw %', (select count(*) from cohort_members);
            end if;
          end $$;
          set app.tenant_id = '00000000-0000-0000-0000-000000000000';
          do $$ begin
            if (select count(*) from cohort_members) <> 0 then
              raise exception 'RLS isolation broken: another tenant sees % rows', (select count(*) from cohort_members);
            end if;
          end $$;
          -- global corpus (org_id NULL) stays visible regardless of tenant
          do $$ begin
            if (select count(*) from documents) <> 8 then
              raise exception 'global corpus invisible under RLS';
            end if;
          end $$;
          SQL
      - name: Integration tests (repos + RLS under the augura_app role)
        run: uv run pytest -m integration -q

  client-drift:
    # The committed TS client must match the backend OpenAPI contract.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --dev
        working-directory: apps/api
      - run: npm install --no-audit --no-fund
        working-directory: packages/api-client
      - name: Regenerate the contract + the client
        env:
          AUGURA_ENV: dev
        run: |
          set -euo pipefail
          uv run --directory apps/api python scripts/dump_openapi.py \
            > packages/api-client/openapi.json
          ( cd packages/api-client && npm run generate )
      - name: Verify there is no drift
        run: git diff --exit-code packages/api-client/openapi.json packages/api-client/src/schema.d.ts
      - name: Typecheck the client
        run: npx tsc --noEmit
        working-directory: packages/api-client
